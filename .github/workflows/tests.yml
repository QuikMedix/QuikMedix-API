name: Tests

# Automatic runs are paused for now; re-enable push/pull_request to run on every change.
on:
  # push:
  # pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_DRIVER: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_sqlite, simplexml, sodium, xml, zip
          coverage: none
          tools: composer:v2
      - run: make prepare-storage
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: npm ci
      - run: npm run build
      - run: composer test
      - run: node tests/smoke/table-navigation.js
      - run: node tests/smoke/tariff-area-editor.js
      - run: composer audit
